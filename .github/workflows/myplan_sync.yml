name: MyPlan Notion -> Google Calendar Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write .env
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_VERSION: ${{ secrets.NOTION_VERSION }}
          NOTION_CONFIG_DATA_SOURCE_ID: ${{ secrets.NOTION_CONFIG_DATA_SOURCE_ID }}
          NOTION_TOPICS_DATA_SOURCE_ID: ${{ secrets.NOTION_TOPICS_DATA_SOURCE_ID }}
          NOTION_TASKS_DATA_SOURCE_ID: ${{ secrets.NOTION_TASKS_DATA_SOURCE_ID }}
          NOTION_LEAVE_DATA_SOURCE_ID: ${{ secrets.NOTION_LEAVE_DATA_SOURCE_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          cat > .env <<EOF
          NOTION_TOKEN=${NOTION_TOKEN}
          NOTION_VERSION=${NOTION_VERSION}
          NOTION_CONFIG_DATA_SOURCE_ID=${NOTION_CONFIG_DATA_SOURCE_ID}
          NOTION_TOPICS_DATA_SOURCE_ID=${NOTION_TOPICS_DATA_SOURCE_ID}
          NOTION_TASKS_DATA_SOURCE_ID=${NOTION_TASKS_DATA_SOURCE_ID}
          NOTION_LEAVE_DATA_SOURCE_ID=${NOTION_LEAVE_DATA_SOURCE_ID}
          GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
          EOF

      - name: Write Google token
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          printf '%s' "$GOOGLE_TOKEN_JSON" > google_token.json

      - name: Run rolling sync pipeline
        run: |
          python -m notion_module.sync_pipeline --commit

      - name: Upload debug outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myplan-sync-debug
          path: notion_debug_output/
          if-no-files-found: ignore
